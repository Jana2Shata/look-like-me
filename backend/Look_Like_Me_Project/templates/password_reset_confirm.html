<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set new password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f3;
      color: #1a1a18;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
    }

    h1 { font-size: 20px; font-weight: 500; margin-bottom: 0.5rem; }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
      margin-top: 1rem;
    }
    label:first-of-type { margin-top: 0; }

    input[type="password"] {
      width: 100%;
      padding: 0 12px;
      height: 38px;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      background: #fff;
      color: #1a1a18;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="password"]:focus {
      border-color: rgba(0,0,0,0.4);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }
    input[type="password"].error { border-color: #c0392b; }

    .strength-bar {
      height: 3px;
      border-radius: 2px;
      background: #e0e0e0;
      margin-top: 8px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      transition: width 0.2s, background 0.2s;
      border-radius: 2px;
    }
    .strength-label {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
      min-height: 16px;
    }

    .error-msg {
      font-size: 12px;
      color: #c0392b;
      margin-top: 5px;
      min-height: 16px;
    }

    /* Non-field errors from Django form */
    .form-errors {
      background: #fdf0f0;
      border: 1px solid #f5c6c6;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      font-size: 13px;
      color: #c0392b;
    }
    .form-errors ul { padding-left: 1rem; }

    button[type="submit"] {
      display: block;
      width: 100%;
      margin-top: 1.5rem;
      padding: 0 16px;
      height: 40px;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 8px;
      background: #fff;
      color: #1a1a18;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover { background: #f5f5f3; }
    button[type="submit"]:active { transform: scale(0.98); }

    /* Success / token-error states */
    .state-panel { text-align: center; padding: 0.5rem 0; }
    .state-panel .icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.15);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      font-size: 20px;
    }
    .state-panel h1 { margin-bottom: 0.5rem; }
    .state-panel p { font-size: 14px; color: #666; line-height: 1.6; }
    .state-panel a { color: #1a1a18; }

    /* Token expired — shown when Django sets invalid_link=True */
    .token-error-msg {
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 8px;
      padding: 1.25rem;
      text-align: center;
    }
    .token-error-msg h1 { margin-bottom: 0.75rem; }
    .token-error-msg p { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 1rem; }
    .token-error-msg a { font-size: 14px; color: #1a1a18; }
  </style>
</head>
<body>

  <div class="token-error-msg">
    <h1>Temporary Page</h1>
    <p>This page will be replaced by a proper front-end page.</br>
      please use the API endpoint for now.</p>
  </div>

  

</div>

<script>
(function () {
  var p1 = document.getElementById('id_new_password1');
  var p2 = document.getElementById('id_new_password2');
  var fill = document.getElementById('strength-fill');
  var lbl = document.getElementById('strength-label');
  var matchErr = document.getElementById('match-error');

  if (!p1) return;  // success state — inputs not present

  function score(pw) {
    var s = 0;
    if (pw.length >= 8)  s++;
    if (pw.length >= 12) s++;
    if (/[A-Z]/.test(pw)) s++;
    if (/[0-9]/.test(pw)) s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    return s;
  }

  p1.addEventListener('input', function () {
    var pw = p1.value;
    if (!pw) { fill.style.width = '0%'; lbl.textContent = ''; return; }
    var s = score(pw);
    var pct  = Math.min(100, s * 20) + '%';
    var cols = ['', '#e74c3c', '#e67e22', '#e67e22', '#27ae60', '#16a085'];
    var lbls = ['', 'Weak', 'Fair', 'Fair', 'Good', 'Strong'];
    fill.style.width = pct;
    fill.style.background = cols[s] || cols[1];
    lbl.textContent = lbls[s] || lbls[1];
    lbl.style.color  = cols[s] || cols[1];
    validateMatch();
  });

  p2.addEventListener('input', validateMatch);

  function validateMatch() {
    if (!p2.value) { matchErr.textContent = ''; p2.classList.remove('error'); return; }
    if (p1.value !== p2.value) {
      matchErr.textContent = 'Passwords do not match.';
      p2.classList.add('error');
    } else {
      matchErr.textContent = '';
      p2.classList.remove('error');
    }
  }
})();
</script>

</body>
</html>
